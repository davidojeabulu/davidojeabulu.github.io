<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      margin: 0;
      color: #1a1a1a;
      background: #ffffff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: linear-gradient(90deg, #1e3a8a, #2563eb);
      color: white;
      position: sticky;
      top: 0;
    }

    header h1 {
      font-size: 1.3rem;
      margin: 0;
    }

    .logo {
      color: white;
      text-decoration: none;
    }

    .hero-about {
      background: url('{{ site.baseurl }}/assets/about-hero.jpg') center/cover no-repeat;
      color: white;
      text-align: center;
      padding: 6rem 2rem;
      position: relative;
    }

    .hero-home {
      background: url('{{ site.baseurl }}/assets/home-hero.jpg') center/cover no-repeat;
      color: white;
      text-align: center;
      padding: 6rem 2rem;
      position: relative;
    }

    .hero-home::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
    }
    
    .hero-home h2,
    .hero-home p {
      position: relative;
      z-index: 1;
    }

    .hero-about::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
    }
    
    .hero-about h2 {
      position: relative;
      z-index: 1;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.95rem;
    }

    .hero {
      background: linear-gradient(to right, #1e3a8a, #2563eb);
      color: white;
      text-align: center;
      padding: 5rem 2rem;
    }

    .hero h2 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 2rem;
    }

    section {
      margin-bottom: 3rem;
    }

    h2 {
      color: #1e3a8a;
      margin-bottom: 1rem;
    }

    .card {
      background: #f9fafb;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    ul {
      padding-left: 20px;
    }

    .grid {
      display: grid;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .grid-2 {
        grid-template-columns: 1fr 1fr;
      }
    }

    footer {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 2rem;
    }

    footer h3 {
      margin-top: 0;
    }

    footer a {
      color: #93c5fd;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1><a href="/" class="logo">Tuition Plus</a></h1>
  <nav>
    <a href="/about.html">About</a>
  </nav>
</header>

{{ content }}

<footer id="contact">
  <h3>Come and visit us or contact us below:</h3>

  <p><strong>Location:</strong><br>234 - 236 Broadway. Bexleyheath. DA6 8AS</p>

  <p><strong>Email:</strong><br>
    <a href="mailto:enquiries@tuitionplus.uk">enquiries@tuitionplus.uk</a>
  </p>

  <p><strong>Phone:</strong><br>
    <a href="tel:+447852621245">+44 7852 621245</a>
  </p>
</footer>
  

</body>
</html>
